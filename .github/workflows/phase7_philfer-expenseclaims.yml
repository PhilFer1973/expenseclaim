# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - philfer-expenseclaims

on:
  push:
    branches:
      - Phase7
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 🛠️ Local Build Section (Optional)
      # The following section in your workflow is designed to catch build issues early on the client side, before deployment. This can be helpful for debugging and validation. However, if this step significantly increases deployment time and early detection is not critical for your workflow, you may remove this section to streamline the deployment process.
      - name: Verify backend files exist
        run: |
          echo "--- backend folder contents ---"
          ls -la backend/
          python -m py_compile backend/server.py
          echo "server.py syntax OK"

      # Deploy only the backend/ subfolder as the app root.
      # SCM_DO_BUILD_DURING_DEPLOYMENT must be false in Azure App Service
      # environment variables so Oryx does not repackage these files into
      # a tarball that never gets extracted.
      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: backend/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_845D4635FB5C4B649AED2E91401D514F }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_2E9CBE6853734A33816877BB81C63B25 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A360E0A794E747BF95158104E72FA565 }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'philfer-expenseclaims'
          slot-name: 'Production'
          